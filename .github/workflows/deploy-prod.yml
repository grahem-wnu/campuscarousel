# Deploy to PROD. Trigger: every push to `main`.
# `main` is reached ONLY via Grahem's Gate-3 promotion PR (dev -> main), so this is
# effectively the manual production promotion path. Same shape as deploy-staging.yml,
# pointed at the prod OIDC role + prod SSM config.
#
# Auth: GitHub OIDC -> AWS_DEPLOY_ROLE_PROD (no long-lived keys).
# Config: read from SSM (/keiras-journey/prod/*) at build time; never hardcoded.
name: Deploy Prod
on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for GitHub OIDC
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  APP_ENV: prod
  SSM_PREFIX: /keiras-journey/prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: no `cache: npm` here on purpose — CI has hit lockfile races across branches.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install root workspace deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Build the real backend Lambda assets (codegen manifest barrel + esbuild bundle) BEFORE
      # cdk deploy, so Code.fromAsset(backend/dist/*) exists at synth time. Without this, synth
      # fails loudly rather than shipping a placeholder. `backend` is a root workspace.
      - name: Build backend Lambdas
        run: npm run -w backend build:lambda

      # Backend (CDK). Self-contained `cd infra` install + deploy (infra is NOT a root
      # workspace). Guarded: no-ops until the CDK app lands on `main`. cdk deploy is idempotent.
      - name: Deploy backend (CDK)
        run: |
          if [ -f infra/package.json ]; then
            (cd infra && npm install --no-audit --no-fund && npm run deploy:prod)
          else
            echo "infra CDK app not present on this ref yet — skipping backend deploy."
            echo "Frontend deploy below still runs against the already-deployed infra (SSM is populated)."
          fi

      - name: Load frontend runtime config from SSM
        run: |
          set -euo pipefail
          api_url=$(aws ssm get-parameter --name "${SSM_PREFIX}/apiUrl" --query Parameter.Value --output text)
          user_pool_id=$(aws ssm get-parameter --name "${SSM_PREFIX}/userPoolId" --query Parameter.Value --output text)
          user_pool_client_id=$(aws ssm get-parameter --name "${SSM_PREFIX}/userPoolClientId" --query Parameter.Value --output text)
          {
            echo "VITE_AWS_REGION=${AWS_REGION}"
            echo "VITE_API_BASE_URL=${api_url}"
            echo "VITE_USER_POOL_ID=${user_pool_id}"
            echo "VITE_USER_POOL_CLIENT_ID=${user_pool_client_id}"
          } >> "$GITHUB_ENV"

      - name: Build frontend (SSM-injected config)
        run: npm run -w frontend build

      - name: Publish frontend (S3 sync + CloudFront invalidate)
        run: |
          set -euo pipefail
          bucket=$(aws ssm get-parameter --name "${SSM_PREFIX}/webBucketName" --query Parameter.Value --output text)
          distribution_id=$(aws ssm get-parameter --name "${SSM_PREFIX}/distributionId" --query Parameter.Value --output text)
          aws s3 sync frontend/dist "s3://${bucket}" --delete
          aws cloudfront create-invalidation --distribution-id "${distribution_id}" --paths '/*'

# Copied to .github/workflows/ at bootstrap (this box's hook blocks direct writes here).
name: CI
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Lint
        run: npm run lint --if-present
      - name: Guard — no duplicate routes across module manifests
        run: npm run check:routes --if-present
      - name: Unit + integration tests
        run: npm test --if-present
      - name: CDK synth (only when the infra workspace exists)
        run: |
          if [ -f infra/package.json ]; then npm run -w infra synth; else echo "infra workspace not present yet — skipping synth"; fi
